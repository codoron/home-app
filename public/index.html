<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>הבית שלנו</title>
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="הבית שלנו">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div id="app">
    <section id="login" class="screen" hidden>
      <div class="login-card">
        <img src="icon.svg" alt="" class="login-logo">
        <h1>הבית שלנו</h1>
        <p>כל הבית החכם במקום אחד</p>
        <button id="loginBtn" class="btn primary big">כניסה עם Google</button>
        <p id="loginErr" class="err" hidden></p>
      </div>
    </section>

    <section id="denied" class="screen" hidden>
      <div class="login-card">
        <img src="icon.svg" alt="" class="login-logo">
        <h1>עוד לא הוזמנת</h1>
        <p>המייל <b id="deniedEmail"></b> לא רשום. בקשו ממנהל הבית להוסיף אתכם.</p>
        <button class="btn" data-signout>התנתקות</button>
      </div>
    </section>

    <section id="main" class="screen" hidden>
      <header class="top">
        <div class="brand"><img src="icon.svg" alt=""><span>הבית שלנו</span></div>
        <div class="status" id="status"></div>
      </header>
      <main id="view"></main>
      <nav class="tabs">
        <button data-tab="rooms" class="active"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg><span>הבית</span></button>
        <button data-tab="mine"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span>שלי</span></button>
        <button data-tab="family"><svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3.3 3.1-6 7-6s7 2.7 7 6zm15.5 0c0-2-.8-3.8-2.1-5.1.5-.1 1-.1 1.6-.1 3 0 5 2.2 5 5.2z"/></svg><span>משפחה</span></button>
      </nav>
    </section>

    <div id="loading" class="screen center"><div class="spinner"></div></div>
  </div>
  <div id="toast" hidden></div>
  <script src="vendor/Sortable.min.js"></script>
  <script type="module" src="app.js?v=19"></script>
</body>
</html>
