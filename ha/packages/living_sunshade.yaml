# Living room sunshade (טריס) - 433MHz RF codes from the BroadLink app scenes "Open sunshade" / "Close sunshade".
# Sent by the living room Broadlink (BroadLink gateway MAC a0:43:b0:32:c4:e8 = remote.rm4plus).
script:
  living_sunshade_open:
    alias: "Living room sunshade open"
    icon: mdi:arrow-expand-horizontal
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.rm4plus
        data:
          command: "b64:"
  living_sunshade_close:
    alias: "Living room sunshade close"
    icon: mdi:arrow-collapse-horizontal
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.rm4plus
        data:
          command: "b64:"
