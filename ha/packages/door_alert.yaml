# Main door left open: after 10 minutes open, and again every 5 minutes while it stays open,
# HA calls the home-app function homeEvent, which sends push + WhatsApp to the family and speaks on the
# living-room Google Home (not 22:00-07:00). When the door closes after an alert: "the door closed".
# Door sensor: Sonoff SNZB-04P "Main door" = binary_sensor.main_door_sonoff_a4b00294d5.
# Speaker (chosen by the function): media_player.google_home. media_player.living_room_speaker is the LG soundbar.

rest_command:
  home_event:
    url: "https://europe-west1-home-app-f94e4.cloudfunctions.net/homeEvent"
    method: POST
    content_type: "application/json"
    timeout: 30
    payload: '{"entity": "binary_sensor.main_door_sonoff_a4b00294d5", "event": "{{ event }}"}'

input_boolean:
  main_door_alerted:
    name: "Main door open alert sent"
    icon: mdi:door-open

automation:
  - id: main_door_open_alert
    alias: "Main door open alert"
    description: "Push + WhatsApp + Google Home when the main door is open 10 min, every 5 min until closed"
    # a close restarts the automation and stops the repeat loop
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.main_door_sonoff_a4b00294d5
        to: "on"
        for: "00:10:00"
        id: open
      - trigger: state
        entity_id: binary_sensor.main_door_sonoff_a4b00294d5
        from: "on"
        to: "off"
        id: closed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: open
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.main_door_alerted
              - repeat:
                  sequence:
                    - action: rest_command.home_event
                      continue_on_error: true
                      data:
                        event: open
                    - delay: "00:05:00"
                  until:
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: binary_sensor.main_door_sonoff_a4b00294d5
                          state: "on"
          - conditions:
              - condition: trigger
                id: closed
              - condition: state
                entity_id: input_boolean.main_door_alerted
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.main_door_alerted
              - action: rest_command.home_event
                continue_on_error: true
                data:
                  event: closed
