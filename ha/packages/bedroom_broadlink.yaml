# Master bedroom Broadlink (RM4 Pro, MAC a0:43:b0:08:22:a9) - IR codes from the BroadLink app scene "Master bedroom".
# The Broadlink remote entity must be renamed to remote.bedroom_rm (Settings > Entities > the remote > gear > Entity ID).
script:
  bedroom_tv_power:
    alias: "Bedroom TV power"
    icon: mdi:television
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.bedroom_rm
        data:
          command: "b64:JgBmAG43Dg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4ODg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4pDg4ODg4ODg4ODg4ODg4ODg4pDg4OKQ4pDikOKQ4ODg4OKQ4ODikOKQ4pDikODg4pDgAFZA=="
  bedroom_tv_volume_up:
    alias: "Bedroom TV volume up"
    icon: mdi:volume-plus
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.bedroom_rm
        data:
          command: "b64:JgBmAG43Dg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4ODg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4pDg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4OKQ4ODg4ODg4ODg4ODg4ODikODg4pDgAFZA=="
  bedroom_tv_volume_down:
    alias: "Bedroom TV volume down"
    icon: mdi:volume-minus
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.bedroom_rm
        data:
          command: "b64:JgBmAG43Dg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4ODg4OKQ4ODg4ODg4ODg4ODg4ODg4ODg4pDg4ODg4ODg4ODg4ODg4ODg4pDg4ODg4ODg4OKQ4ODg4OKQ4ODg4ODg4ODikODg4pDgAFZA=="
  bedroom_fan_off:
    alias: "Bedroom fan off"
    icon: mdi:fan-off
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.bedroom_rm
        data:
          command: "b64:"
  bedroom_fan_low:
    alias: "Bedroom fan low"
    icon: mdi:fan-speed-1
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.bedroom_rm
        data:
          command: "b64:"

# The fan light as a light (one-way IR, so its state is optimistic).
template:
  - light:
      - name: "Bedroom fan light"
        unique_id: bedroom_fan_light
        turn_on:
          - action: remote.send_command
            target:
              entity_id: remote.bedroom_rm
            data:
              command: "b64:"
        turn_off:
          - action: remote.send_command
            target:
              entity_id: remote.bedroom_rm
            data:
              command: "b64:"
